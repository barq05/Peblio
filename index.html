<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peblio</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#01539d;--acc:#f8c535;--bg:#f8f2ea;--ink:#0b2349;--mute:#5d6b85;--line:#e6dccd;--card:#fffdf9;--bad:#ee4b3b;--ok:#2e9c61;--inp:#fff}
[hidden]{display:none!important}
:root[data-theme="dark"]{--bg:#0b1a33;--ink:#f4efe7;--mute:#a4b3cf;--line:#223d6b;--card:#112548;--inp:#0b1a33;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
button,input,select{font:inherit}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--inp);color:var(--ink);min-width:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 20px;border-radius:99px;cursor:pointer;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,calc((100% - 1040px)/2));padding-top:calc(10px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .l{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nav a.b{font-weight:800;font-size:1.4rem;color:var(--ink);text-decoration:none;margin-inline-end:12px}
.nav a.b img{height:34px;vertical-align:middle}
.lk{background:none;border:0;color:var(--ink);padding:6px 10px;border-radius:99px;cursor:pointer}.lk:hover{background:var(--line)}
.sec{max-width:1040px;margin:0 auto 56px;padding:0 16px}
.sec>h2{font-size:1.8rem;margin:0 0 16px;font-weight:800}
.hero{position:relative;overflow:hidden;max-width:1040px;margin:16px auto 40px;border-radius:32px;background:var(--card);border:1px solid var(--line);isolation:isolate;display:grid;grid-template-columns:1fr;gap:20px;align-items:center;padding:70px 28px}
.hero.hi{grid-template-columns:1.2fr 1fr}
.hero h1{font-size:clamp(3rem,12vw,5.6rem);line-height:1;margin:0;font-weight:800;letter-spacing:-.02em}
.hero p{font-size:1.15rem;color:var(--mute);max-width:480px;margin:12px 0 22px}
.hero:not(.hi){text-align:center}.hero:not(.hi) p{margin-inline:auto}
.himg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;box-shadow:0 18px 40px rgba(0,0,0,.15)}
.bl{position:absolute;border-radius:50%;z-index:-1;animation:fl 10s ease-in-out infinite alternate;opacity:.95}
.b1{width:210px;height:210px;background:var(--pri);top:-70px;inset-inline-start:-60px}
.b2{width:150px;height:150px;background:#ee4b3b;top:30px;inset-inline-end:-45px;animation-delay:-3s}
.b3{width:180px;height:180px;background:var(--acc);bottom:-80px;inset-inline-start:8%;animation-delay:-6s}
.b4{width:220px;height:220px;background:#2e9c61;bottom:-100px;inset-inline-end:6%;animation-delay:-2s}
@keyframes fl{to{transform:translate(14px,-18px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.bl{animation:none}html{scroll-behavior:auto}}
@media (max-width:700px){.hero.hi{grid-template-columns:1fr;text-align:center}.hero.hi p{margin-inline:auto}}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card b{display:block;margin-bottom:4px}.card span{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chips input{flex:1 1 200px;border-radius:99px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 16px;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.pc:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.1)}
.pc img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--line)}
.pc .t{cursor:pointer}.pc .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc small{color:var(--mute)}.pc .btn{margin-top:auto}
.pr{font-weight:800;font-size:1.1rem}.pr s{color:var(--mute);font-weight:400;font-size:.9rem;margin-inline-start:6px}
.bdg{align-self:flex-start;background:var(--acc);color:#2a1f00;border-radius:99px;padding:1px 12px;font-size:.78rem;font-weight:600}
.low{color:var(--bad);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.row>*{flex:1 1 140px}.row .btn{flex:0 0 auto}
.empty{color:var(--mute);text-align:center;padding:24px;grid-column:1/-1}
footer{text-align:center;color:var(--mute);padding:30px 16px calc(90px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.wa{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:16px;background:var(--ok);color:#fff;text-decoration:none;padding:10px 20px;border-radius:99px;font-weight:600;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.2)}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);max-width:460px;width:92%;padding:20px}
dialog::backdrop{background:rgba(11,35,73,.5)}
dialog h2{margin:0 0 10px}
#qv img,#qv .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}
.ln{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ln span{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<a class="wa" id="wab" target="_blank" rel="noopener" hidden>واتساب</a>
<dialog id="cart"><h2>سلة المشتريات</h2><div id="cl"></div>
<div class="row"><input id="kcp" placeholder="كود الخصم"><button class="btn ghost" id="apk">تطبيق</button></div>
<div id="cs"></div>
<div class="row"><input id="bn" placeholder="الاسم"><input id="bph" placeholder="رقم الموبايل" inputmode="tel"></div>
<div class="row"><input id="bc" placeholder="المحافظة والعنوان بالتفصيل"></div>
<div class="row"><select id="bp" aria-label="طريقة الدفع"></select></div>
<div id="pinfo" style="color:var(--mute);font-size:.9rem"></div>
<div class="row" style="margin-top:10px"><button class="btn" id="buy">تأكيد الطلب</button><button class="btn ghost" id="cx">إغلاق</button></div></dialog>
<dialog id="qv"><div id="qvb"></div><div class="row" style="margin-top:12px"><button class="btn" id="qva">أضف للسلة</button><button class="btn ghost" id="qvc">إغلاق</button></div></dialog>
<script>
const API='https://script.google.com/macros/s/AKfycbySlCCiQC5dXY-pGcD68cnuTs2-DmhVqCa7GzkmF8Mam5TazxoqYGoCYznEJf253Mo6dw/exec';
const DS={brand:'Peblio',logo:'',
 hero:{title:'Peblio',sub:'ألوان جواش مصنوعة لكل من يحب الرسم. زاهية وثابتة وسهلة الاستخدام.',cta:'تسوّق الآن',img:'',blobs:true},
 colors:{pri:'#01539d',acc:'#f8c535',bg:'#f8f2ea',ink:'#0b2349'},
 features:[{t:'ألوان ثابتة',d:'صبغات عالية التركيز تدوم على الورق.'},{t:'شحن لكل المحافظات',d:'توصيل لحد باب البيت في أنحاء مصر.'},{t:'دفع مرن',d:'كاش عند الاستلام أو محفظة أو إنستاباي.'}],
 reviews:[],jobs:[],
 faq:[{q:'إزاي أعرف إن طلبي اتسجل؟',a:'هتظهر لك رسالة تأكيد برقم الطلب، وهنتواصل معاك على رقمك.'},{q:'إيه طرق الدفع المتاحة؟',a:'بتظهر في السلة حسب المتاح حاليًا.'},{q:'ينفع أستخدم كود خصم؟',a:'أيوه، اكتب الكود في السلة قبل تأكيد الطلب.'}],
 titles:{best:'الأكثر طلبًا',products:'كل المنتجات',reviews:'آراء عملائنا',faq:'أسئلة شائعة',support:'الدعم الفني',jobs:'انضم لفريقنا'},
 footer:'ألوان جواش مصنوعة بحب',wa:'',
 order:['hero','features','best','products','reviews','faq','jobs','support'],hide:{}};
let TH='light';try{TH=localStorage.getItem('peblio-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
function applyTheme(c){const r=document.documentElement.style,d=TH==='dark';document.documentElement.dataset.theme=TH;r.setProperty('--pri',d?`color-mix(in srgb,${c.pri} 72%,#fff)`:c.pri);r.setProperty('--acc',c.acc);if(d){r.removeProperty('--bg');r.removeProperty('--ink')}else{r.setProperty('--bg',c.bg);r.setProperty('--ink',c.ink)}}
let site=DS,P=[],PAY=[],FF='all',FQ='',cart={},kc=null,QV=0;
try{cart=JSON.parse(localStorage.getItem('peblio-cart'))||{}}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Number(n).toLocaleString('ar-EG'),fmt=n=>num(n)+' ج.م';
const eff=p=>Math.round(p.p*(1-(p.sale||0)/100));
const prod=id=>P.find(p=>p.id==id);
const PV=/[?&]preview=1/.test(location.search);
const api=o=>PV?Promise.resolve({error:'ده وضع المعاينة فقط، مفيش إرسال فعلي.'}):fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)}).then(r=>r.json());
const merge=s=>{const o={...DS,...s,hero:{...DS.hero,...s.hero},colors:{...DS.colors,...s.colors},titles:{...DS.titles,...s.titles},hide:{...s.hide}};o.order=[...(s.order||DS.order)];DS.order.forEach(k=>{if(!o.order.includes(k))o.order.push(k)});return o};
const pic=p=>p.img?`<img src="${esc(p.img)}" alt="${esc(p.n)}" loading="lazy">`:`<div class="ph"></div>`;
const pcard=p=>`<article class="pc"><div class="t" data-qvw="${p.id}">${pic(p)}</div><div class="b">${p.best?'<span class="bdg">الأكثر طلبًا</span>':''}<b>${esc(p.n)}</b><small>${esc(p.d)}</small><div class="pr">${fmt(eff(p))}${p.sale?`<s>${fmt(p.p)}</s>`:''}</div>${p.sale?`<small class="low">خصم ${num(p.sale)}٪</small>`:''}<button class="btn" data-add="${p.id}" ${p.q>0?'':'disabled'}>${p.q>0?'أضف للسلة':'نفد المخزون'}</button></div></article>`;
const SEC={
 hero:()=>{const h=site.hero;return `<header class="hero ${h.img?'hi':''}">${h.blobs?'<i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i><i class="bl b4"></i>':''}<div><h1>${esc(h.title)}</h1><p>${esc(h.sub)}</p><button class="btn" data-go="products">${esc(h.cta)}</button></div>${h.img?`<img class="himg" src="${esc(h.img)}" alt="">`:''}</header>`},
 features:()=>`<section class="sec feat" id="features">${site.features.map(f=>`<div class="card"><b>${esc(f.t)}</b><span>${esc(f.d)}</span></div>`).join('')}</section>`,
 best:()=>{const b=P.filter(p=>p.best);return b.length?`<section class="sec" id="best"><h2>${esc(site.titles.best)}</h2><div class="grid">${b.map(pcard).join('')}</div></section>`:''},
 products:()=>`<section class="sec" id="products"><h2>${esc(site.titles.products)}</h2><div class="chips"><input id="fq" placeholder="ابحث عن منتج" value="${esc(FQ)}"><button data-ff="all" class="${FF==='all'?'on':''}">الكل</button><button data-ff="best" class="${FF==='best'?'on':''}">الأكثر طلبًا</button><button data-ff="sale" class="${FF==='sale'?'on':''}">عليها خصم</button></div><div class="grid" id="allg"></div></section>`,
 reviews:()=>site.reviews.length?`<section class="sec" id="reviews"><h2>${esc(site.titles.reviews)}</h2><div class="feat">${site.reviews.map(r=>`<div class="card"><b>${esc(r.n)}</b><span>${esc(r.t)}</span></div>`).join('')}</div></section>`:'',
 faq:()=>site.faq.length?`<section class="sec" id="faq"><h2>${esc(site.titles.faq)}</h2>${site.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('')}</section>`:'',
 jobs:()=>`<section class="sec" id="jobs"><div class="card"><h2 style="margin-top:0">${esc(site.titles.jobs)}</h2>${site.jobs.length?`<div class="feat" style="margin-bottom:14px">${site.jobs.map(j=>`<div class="card"><b>${esc(j.t)}</b><span>${esc(j.d)}</span></div>`).join('')}</div>`:'<p style="color:var(--mute)">ابعت لنا بياناتك وهنتواصل معاك لما تتوفر وظيفة مناسبة.</p>'}<div class="row"><input id="jn" placeholder="الاسم"><input id="jph" placeholder="رقم الموبايل" inputmode="tel"></div><div class="row"><input id="jr" list="jl" placeholder="الوظيفة المتقدم لها"><datalist id="jl">${site.jobs.map(j=>`<option value="${esc(j.t)}">`).join('')}</datalist></div><div class="row"><input id="jm" placeholder="نبذة عن خبرتك أو رابط سيرتك الذاتية" style="flex:3 1 240px"><button class="btn" id="addj">إرسال الطلب</button></div></div></section>`,
 support:()=>`<section class="sec" id="support"><div class="card"><h2 style="margin-top:0">${esc(site.titles.support)}</h2><div class="row"><input id="tn" placeholder="اسمك"><input id="tph" placeholder="رقم الموبايل" inputmode="tel"></div><div class="row"><input id="tm" placeholder="اكتب سؤالك أو مشكلتك" style="flex:3 1 240px"><button class="btn" id="addt">إرسال</button></div></div></section>`};
function gridR(){
  const L=P.filter(p=>(!FQ||(p.n+' '+p.d).includes(FQ))&&(FF==='all'||(FF==='best'&&p.best)||(FF==='sale'&&p.sale>0)));
  const g=$('allg');if(g)g.innerHTML=L.length?L.map(pcard).join(''):`<p class="empty">${P.length?'مفيش منتجات مطابقة.':'المنتجات قريبًا.'}</p>`;
  const n=Object.values(cart).reduce((a,b)=>a+b,0);$('cn0')&&($('cn0').textContent=num(n));
}
function render(){
  const c=site.colors,r=document.documentElement.style;
  applyTheme(c);
  document.title=site.brand;
  const nav=`<nav class="nav"><a class="b" href="#">${site.logo?`<img src="${esc(site.logo)}" alt="${esc(site.brand)}">`:esc(site.brand)}</a><div class="l"><button class="lk" data-go="products">${esc(site.titles.products)}</button><button class="lk" data-go="faq">${esc(site.titles.faq)}</button><button class="lk" data-go="support">${esc(site.titles.support)}</button><button class="lk" id="thb" aria-label="تبديل الوضع الغامق والفاتح">${TH==='dark'?'☀':'☾'}</button><button class="btn" id="cartb">السلة (<span id="cn0">٠</span>)</button></div></nav>`;
  $('app').innerHTML=nav+site.order.filter(k=>SEC[k]&&!site.hide[k]).map(k=>SEC[k]()).join('')+`<footer><b>${esc(site.brand)}</b> · ${esc(site.footer)}<br>طرق الدفع: ${esc(PAY.map(x=>x.n).join('، ')||'-')}</footer>`;
  const w=$('wab'),n=String(site.wa||'').replace(/\D/g,'');w.hidden=!n;if(n)w.href='https://wa.me/'+n;
  gridR();
}
function sums(){
  const l=Object.keys(cart).map(id=>({p:prod(id),n:cart[id]})).filter(x=>x.p),sub=l.reduce((a,x)=>a+eff(x.p)*x.n,0);
  const kd=kc?(kc.t==='pct'?Math.round(sub*kc.v/100):Math.min(kc.v,sub)):0;return {l,sub,kd,tot:sub-kd};
}
function saveCart(){try{localStorage.setItem('peblio-cart',JSON.stringify(cart))}catch(e){}gridR()}
function cartR(){
  const s=sums();
  $('cl').innerHTML=s.l.length?s.l.map(x=>`<div class="ln"><span>${esc(x.p.n)} × ${num(x.n)}</span><b>${fmt(eff(x.p)*x.n)}</b><button class="btn ghost" data-rm="${x.p.id}">حذف</button></div>`).join(''):'<p class="empty">السلة فاضية.</p>';
  $('cs').innerHTML=`<div class="ln"><span>المجموع</span>${fmt(s.sub)}</div>${s.kd?`<div class="ln"><span>خصم الكود ${esc(kc.code)}</span>-${fmt(s.kd)}</div>`:''}<div class="ln"><b style="flex:1">الإجمالي</b><b>${fmt(s.tot)}</b></div>`;
  const cur=$('bp').value;$('bp').innerHTML=PAY.map(x=>`<option value="${x.id}" ${x.id==cur?'selected':''}>${esc(x.n)}</option>`).join('');payinfo();
}
const payinfo=()=>{const x=PAY.find(y=>y.id==$('bp').value);$('pinfo').textContent=x&&x.info?'حوّل على: '+x.info:''};
const addToCart=id=>{const p=prod(id);if(p&&p.q>0){cart[id]=Math.min((cart[id]||0)+1,p.q);saveCart();cartR();$('cart').showModal()}};
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-qvw]');if(!t)return;const d=t.dataset;
  if(d.go){const el=$(d.go);el&&el.scrollIntoView({behavior:'smooth'})}
  if(d.add)addToCart(d.add);
  if(d.rm){delete cart[d.rm];saveCart();cartR()}
  if(d.ff){FF=d.ff;document.querySelectorAll('[data-ff]').forEach(b=>b.classList.toggle('on',b===t));gridR()}
  if(d.qvw){const p=prod(d.qvw);QV=p.id;$('qvb').innerHTML=`${pic(p)}<h2 style="margin-top:12px">${esc(p.n)}</h2><p>${esc(p.d)}</p><div class="pr">${fmt(eff(p))}${p.sale?`<s>${fmt(p.p)}</s>`:''}</div>`;$('qva').disabled=p.q<1;$('qv').showModal()}
});
document.addEventListener('input',e=>{if(e.target.id==='fq'){FQ=e.target.value.trim();gridR()}});
document.addEventListener('click',e=>{if(e.target.closest('#cartb')){cartR();$('cart').showModal()}
  if(e.target.closest('#thb')){TH=TH==='dark'?'light':'dark';if(!PV){try{localStorage.setItem('peblio-theme',TH)}catch(x){}}applyTheme(site.colors);$('thb').textContent=TH==='dark'?'☀':'☾'}});
$('cx').onclick=()=>$('cart').close();$('qvc').onclick=()=>$('qv').close();$('bp').onchange=payinfo;
$('qva').onclick=()=>{$('qv').close();addToCart(QV)};
$('apk').onclick=()=>{const c=$('kcp').value.trim();if(!c)return;$('apk').disabled=true;api({a:'coupon',code:c}).then(r=>{$('apk').disabled=false;if(r.error){alert(r.error);return}kc=r;cartR()}).catch(()=>{$('apk').disabled=false;alert('تعذر التحقق من الكود. حاول مرة تانية.')})};
$('buy').onclick=()=>{
  const s=sums(),n=$('bn').value.trim(),ph=$('bph').value.trim(),c=$('bc').value.trim();
  if(!s.l.length||!n||!ph||!c||!$('bp').value){alert('أضف منتجات، واكتب الاسم والموبايل والعنوان، واختر طريقة الدفع.');return}
  $('buy').disabled=true;$('buy').textContent='جاري الإرسال...';
  api({a:'order',name:n,phone:ph,city:c,pay:$('bp').value,coupon:kc?kc.code:'',items:s.l.map(x=>({id:x.p.id,n:x.n}))}).then(r=>{
    if(r.error){alert(r.error);load();return}
    cart={};kc=null;saveCart();['bn','bph','bc','kcp'].forEach(i=>$(i).value='');$('cart').close();load();
    alert('تم استلام طلبك رقم '+r.id+' بإجمالي '+fmt(r.total)+'. هنتواصل معاك قريبًا.');
  }).catch(()=>alert('تعذر إرسال الطلب. تأكد من الإنترنت وحاول تاني.')).finally(()=>{$('buy').disabled=false;$('buy').textContent='تأكيد الطلب'});
};
document.addEventListener('click',e=>{
  if(!e.target.closest('#addt'))return;const n=$('tn').value.trim(),m=$('tm').value.trim();
  if(!n||!m){alert('اكتب اسمك ورسالتك.');return}
  api({a:'support',name:n,phone:$('tph').value.trim(),message:m}).then(r=>{if(r.error){alert(r.error);return}['tn','tph','tm'].forEach(i=>$(i).value='');alert('وصلتنا رسالتك، وهنرد عليك في أقرب وقت.')}).catch(()=>alert('تعذر الإرسال. حاول تاني.'));
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#addj'))return;const n=$('jn').value.trim(),p=$('jph').value.trim(),r=$('jr').value.trim();
  if(!n||!p||!r){alert('اكتب اسمك ورقم موبايلك والوظيفة المتقدم لها.');return}
  api({a:'job',name:n,phone:p,role:r,message:$('jm').value.trim()}).then(x=>{if(x.error){alert(x.error);return}['jn','jph','jr','jm'].forEach(i=>$(i).value='');alert('وصل طلبك، وهنتواصل معاك لو فيه فرصة مناسبة. شكرًا لاهتمامك.')}).catch(()=>alert('تعذر الإرسال. حاول تاني.'));
});
function load(){
  return fetch(API).then(r=>r.json()).then(r=>{site=merge(r.site||{});P=r.products||[];PAY=r.pay||[];Object.keys(cart).forEach(id=>{if(!prod(id))delete cart[id]});render()}).catch(()=>{render()});
}
if(PV){addEventListener('message',e=>{const d=e.data;if(e.origin!==location.origin||!d||!d.peblio)return;if(d.theme)TH=d.theme;site=merge(d.site||{});P=d.products||[];PAY=d.pay||[];render()});render()}else{render();load()}
